blueprint:
  name: Aqara TRV E1 External Temperature Control (deadband)
  description: 'Feeds an external temperature sensor into an Aqara E1 TRV. Applies
    a deadband so small sensor changes don''t flood the TRV with Zigbee writes (which
    can fail with "Request superseded"). A time-based max interval ensures the TRV
    still gets periodic updates during slow drift.

    '
  domain: automation
#  source_url: https://gist.github.com/JakeCowton/55ee468775d8318ce58c4c4842a568b8?utm_source=chatgpt.com
  input:
    external_temp_sensor:
      name: External Temperature Sensor
      description: Select the temperature sensor that will provide temperature readings
        to the Aqara TRV.
      selector:
        entity:
          filter:
          - domain:
            - sensor
            device_class:
            - temperature
          multiple: false
          reorder: false
    aqara_trv_device:
      name: Aqara TRV Device
      description: Select the Aqara Smart Radiator Thermostat E1 that will receive
        the external temperature data.
      selector:
        device:
          multiple: false
          filter:
          - integration: mqtt
            manufacturer: Aqara
            model: Smart radiator thermostat E1 (SRTS-A01)
          - integration: mqtt
            manufacturer: Aqara
            model: Smart radiator thermostat E1
          - integration: mqtt
            manufacturer: Aqara
            model: Aqara Smart Radiator thermostat E1 (SRTS-A01)
          - integration: mqtt
            manufacturer: Aqara
            model: Aqara smart radiator thermostat E1 (SRTS-A01)
    external_temperature_input_name:
      name: TRV's Input Sensor Name
      description: Keyword used to identify the TRV's number entity that sets the
        external temperature value. Defaults to 'external'.
      selector:
        text:
          multiline: false
          multiple: false
      default: external
    deadband:
      name: Deadband (°C)
      description: 'Only write a new value to the TRV when the sensor reading differs
        from the last written value by at least this much. Prevents rapid-fire Zigbee
        writes causing "Request superseded" failures.

        '
      default: 0.2
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          unit_of_measurement: °C
          mode: slider
    max_interval_minutes:
      name: Maximum interval between writes (minutes)
      description: 'Even if the sensor hasn''t moved by the deadband, force a write
        after this many minutes so the TRV doesn''t act on stale data during slow
        drift.

        '
      default: 10
      selector:
        number:
          min: 1.0
          max: 60.0
          step: 1.0
          unit_of_measurement: min
          mode: slider
mode: single
max_exceeded: silent
variables:
  aqara_trv_device: !input aqara_trv_device
  external_temp_sensor: !input external_temp_sensor
  external_temperature_input_name: !input external_temperature_input_name
  deadband: !input deadband
  max_interval_minutes: !input max_interval_minutes

trigger:
- trigger: state
  entity_id: !input external_temp_sensor
  id: temperature
- trigger: time_pattern
  minutes: "/10"
  id: periodic
action:
- variables:
    aqara_trv_device_name: '{{ device_attr(aqara_trv_device, ''name'') }}'
    aqara_trv_select_entity: "{% set device_entities = device_entities(aqara_trv_device)
      %} {{ expand(states['select'])\n          | selectattr('entity_id','in', device_entities)\n
      \         | selectattr('attributes.options', 'contains', 'external')\n          |
      map(attribute='entity_id')\n          | first\n}}"
    aqara_trv_number_entity: "{% set device_entities = device_entities(aqara_trv_device)
      %} {{ expand(states['number'])\n          | selectattr('entity_id','in', device_entities)\n
      \         | selectattr('entity_id', 'contains', external_temperature_input_name)\n
      \         | map(attribute='entity_id')\n          | first\n}}"
    mode_was_wrong: '{{ not is_state(aqara_trv_select_entity, ''external'') }}'
- if:
  - condition: template
    value_template: '{{ is_state(external_temp_sensor, "unavailable") or is_state(external_temp_sensor,
      "unknown") }}'
  then:
  - action: select.select_option
    target:
      entity_id: '{{ aqara_trv_select_entity }}'
    data:
      option: internal
  - action: system_log.write
    data:
      level: error
      message: External temperature sensor unavailable
      logger: Aqara TRV
  - stop: External temperature sensor unavailable
- if:
  - condition: template
    value_template: '{{ mode_was_wrong }}'
  then:
  - action: select.select_option
    target:
      entity_id: '{{ aqara_trv_select_entity }}'
    data:
      option: external
  - delay:
      seconds: 10
- variables:
    new_value: '{{ states(external_temp_sensor) | float(0) | round(1) }}'
    last_written: '{{ states(aqara_trv_number_entity) | float(-999) }}'
    last_written_age_min: '{% set s = states[aqara_trv_number_entity] %} {{ ((now()
      - s.last_changed).total_seconds() / 60) if s and s.last_changed else 99999 }}'
    delta: '{{ (new_value - last_written) | abs }}'
    should_write: >-
      {{ trigger.id == 'periodic'
      or mode_was_wrong
      or last_written <= -998
      or delta >= (deadband | float(0.2))
      or last_written_age_min >= (max_interval_minutes | float(10)) }}
- if:
  - condition: template
    value_template: '{{ should_write }}'
  then:
  - action: number.set_value
    data:
      value: '{{ new_value }}'
    target:
      entity_id: '{{ aqara_trv_number_entity }}'
